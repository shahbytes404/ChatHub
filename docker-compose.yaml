networks:
  chathub-network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: chathub-postgres
    environment:
      POSTGRES_DB: chathub
      POSTGRES_USER: chathub
      POSTGRES_PASSWORD: chathub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgres/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U chathub -d chathub" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chathub-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chathub-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@google.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chathub-network

  redis:
    image: redis:7-alpine
    container_name: chathub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly","yes" ]
    healthcheck:
      test: [ "CMD","redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chathub-network

  backend:
    build:
      context: ./backend
    container_name: chathub-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chathub
      SPRING_DATASOURCE_USERNAME: chathub
      SPRING_DATASOURCE_PASSWORD: chathub
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chathub-network


volumes:
  postgres_data:
  pgadmin_data:
  redis_data: